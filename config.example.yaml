# Copy this file to config.yaml and fill in real values. config.yaml is
# gitignored and never pushed to GitHub.

# mlx-whisper model repo (Hugging Face). Larger/non-quantized models are
# slower but more accurate. Can be overridden per-run with
# `transcribe.py --model <repo-id>`. See docs/analysis/model-weight-analysis.md
# for a speed/accuracy comparison — the fp16 turbo model avoided a
# repetition-hallucination failure mode the 4-bit quantized version hit, at
# comparable speed.
whisper_model: mlx-community/whisper-large-v3-turbo

# Local directory model weights are downloaded into (and read from). Created
# automatically on first run if missing. Gitignored — weights are large and
# environment-specific. Defaults to ./models if omitted.
model_dir: ./models

# Maps Craig's Discord usernames (discriminator stripped, e.g. "alice42#0"
# becomes "alice42") to the name that should appear in the transcript.
# Defaults to an empty map if omitted. Unmapped users appear under their raw
# Discord name, with a warning at startup.
speaker_map:
  alice42: Alice
  someplayer: Some Player

# Path to a vocabulary.md file (campaign terms, post-fix corrections, and
# Whisper prompt seeding). Optional — if omitted, ./vocabulary.md is used
# when it exists. Overridable per-run with `transcribe.py --vocabulary <path>`.
# See vocabulary.example.md for the file format.
vocabulary_file: ./vocabulary.md

# Whisper language code (e.g. "en") to force for every track, instead of
# auto-detecting per track. Auto-detection only samples the first VAD speech
# region of each track; a short, noisy, or ambiguous one can guess wrong,
# and that wrong guess is then pinned for the rest of the track, producing
# hallucinated non-English text throughout. Forcing a known language skips
# that guess entirely. Optional — omit to auto-detect (mlx-whisper's
# default). Overridable per-run with `transcribe.py --language <code>`.
language: en

# Gzip compression ratio above which mlx_whisper retries a region's decode
# at a higher temperature, treating it as a repetition failure. A segment
# still above this threshold after retrying is flagged with a "!! " prefix
# in the transcript for human review. Lowering it triggers more retries
# (slower, but catches more repetitive/garbled decodes); raising it lets
# more repetitive text through unflagged and unretried. Defaults to 2.4 if
# omitted, matching mlx-whisper's own default. Overridable per-run with
# `transcribe.py --compression-ratio-threshold <value>`.
compression_ratio_threshold: 2.4

# Average per-token log-probability below which mlx_whisper retries a
# region's decode at a higher temperature, treating it as a low-confidence
# failure. A segment still below this threshold after retrying is flagged
# with a "!! " prefix in the transcript for human review. Catches garbled/
# wrong-language decodes that compression_ratio_threshold misses — made-up
# words are high-entropy text, so they don't trip the ratio check even
# though the model had low confidence in them. Raising it (closer to 0)
# triggers more retries/flags; lowering it lets more low-confidence text
# through unflagged. Defaults to -1.0 if omitted, matching mlx-whisper's own
# default. Overridable per-run with `transcribe.py --logprob-threshold
# <value>`.
logprob_threshold: -1.0

# When a segment is retried at a higher temperature (see
# compression_ratio_threshold above), sample this many independent decodes
# at that temperature and keep the best-ranked one instead of just one
# resample. Has no effect on the initial greedy decode (mlx_whisper disables
# best_of at temperature 0), so it only spends extra time on segments
# already flagged as hard. mlx_whisper doesn't implement beam search
# (beam_size), so this is the available way to add search on retries.
# Optional — omit to leave mlx_whisper's default (a single resample per
# retry, no ranking). Overridable per-run with `transcribe.py --best-of <n>`.
# Benchmarked at 5 and NOT recommended: it ranks retry candidates by average
# log-probability, which can favor a confident repetition loop over a
# correct-but-less-certain transcription, and in 2 of 3 test windows it
# introduced new hallucination loops greedy decoding didn't produce, at
# 2-3.5x the decode time. See docs/analysis/best-of-decoding-analysis.md.
# best_of: 5

# Whether a flagged/low-confidence line keeps an inline "!! [inaudible]"
# placeholder in the main transcript. The line's original garbled text is
# always written to the companion <slug>.errors.md file either way. Defaults
# to false (flagged lines are omitted from the main transcript entirely, so
# it reads as continuous speech). Overridable per-run with
# `transcribe.py --show-inaudible` / `--hide-inaudible`.
show_inaudible_placeholders: false

# Co-located mic bleed dedup: when two players share a room, each mic picks
# up the other and Whisper transcribes the bleed as a duplicate line. A
# matching cross-track pair is dropped only if the audio shows a correlated,
# attenuated copy; see docs/design/transcription-pipeline.md. Tune these from
# `transcribe.py --verbose` output.
# Minimum dB gap between the louder and quieter track over the pair's span.
bleed_level_gap_db: 4
# Minimum envelope correlation (max over +/-150ms lag) between the two tracks.
bleed_min_correlation: 0.3
# Minimum text similarity (0-1) for two segments to count as the same line.
bleed_text_similarity: 0.6
# Maximum difference, in seconds, between the two segments' start times.
bleed_max_offset_s: 2
# Prefix the kept quieter copy of an ambiguous pair with
# "[possible bleed: <louder speaker>]" for manual review. Overridable per-run
# with `transcribe.py --show-bleed-markers` / `--hide-bleed-markers`.
show_bleed_markers: false

# Whether gui.py saves its log panel next to the transcript as
# `<session-title>.log` after a successful run. The GUI's "Save log"
# checkbox starts from this value. The CLI ignores it.
save_gui_log: true

# Directory the transcript Markdown files are written to. Defaults to
# ./transcripts if omitted.
output_dir: ./transcripts

# Directory to drop Craig .zip exports into for automatic pickup. Processed
# zips are moved into a `processed/` subfolder here.
input_dir: ./input

# Minimum pause (in milliseconds) that splits speech into separate regions
# before transcription. Too low fragments speech on tiny pauses/breaths,
# which can degrade transcription quality (occasional garbled/wrong-language
# text) and produces more, shorter transcript lines. Too high risks merging
# distinct utterances together. Defaults to 800 if omitted.
vad_min_silence_ms: 800

# Minimum speech duration (in milliseconds) for a detected region to be kept.
# Shorter detected "speech" (coughs, breath, mic pops) is dropped before it
# ever reaches Whisper. Defaults to 250 if omitted, matching Silero's own
# default.
vad_min_speech_ms: 250

# Maximum silence (in milliseconds) between two segments from the *same
# speaker* before they're merged into one transcript line instead of kept as
# separate fragmented lines. Whisper often splits one sentence into several
# segments; this stitches them back together. May need tuning alongside
# vad_min_silence_ms for best results, since VAD's own silence-gap merging
# affects how Whisper chunks speech in the first place. Defaults to 2000 if
# omitted.
merge_gap_ms: 2000

# Words dropped entirely when they're a transcript line's whole text
# (case/trailing-punctuation-insensitive) — cut-off speech, coughs, or
# laughs that Whisper mistranscribed as a bare word. Never strips a word out
# of a longer real sentence, and never applies to a "!! "-flagged line.
# Defaults to the list below if omitted.
filler_words: ["so", "you", "um", "uh", "hm", "hmm"]

# strftime() format for each line's timestamp. Defaults to "%H:%M:%S" if
# omitted.
timestamp_format: "%H:%M:%S"

# "elapsed" stamps each line with time since the start of the recording, so
# the first segment reads 00:00:00; "clock" stamps it with the real
# wall-clock time it was recorded. Defaults to "elapsed" if omitted.
# Overridden by --elapsed-timestamps / --clock-timestamps.
timestamp_mode: "elapsed"

# str.format() template for each transcript line. Supports {timestamp},
# {speaker}, and {text} placeholders — use Markdown here to control the
# output styling, e.g. bold speaker names with "**{speaker}**". Defaults to
# "[{timestamp}] {speaker}: {text}" if omitted.
line_format: "[{timestamp}] {speaker}: {text}"
